name: build-standalone
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            exe: dist/ResumeCheck.exe
            artifact: resumecheck-Windows
            shell: pwsh
          - os: macos-latest
            exe: dist/ResumeCheck.app
            artifact: resumecheck-macOS
            shell: bash
          - os: ubuntu-latest
            exe: dist/ResumeCheck
            artifact: resumecheck-Linux
            shell: bash
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Folder upload UI tests
        run: node --test source/frontend/tests/setup.test.js
      - name: Install test dependencies
        run: python -m pip install -r source/backend/requirements-dev.txt
      - name: Backend and launcher tests
        working-directory: source
        run: python -m pytest backend/tests -q
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: .\packaging\build_windows.ps1
      - name: Build (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r source/backend/requirements.txt "pyinstaller==6.22.3"
          python -c "import shutil; [shutil.rmtree(d, ignore_errors=True) for d in ('build', 'dist')]"
          python -m PyInstaller --noconfirm packaging/resumecheck.spec
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: |
          .\.github\workflows\smoke_win.ps1 -Exe dist\ResumeCheck.exe
      - name: Smoke test (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          python packaging/smoke.py "${{ matrix.exe }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.exe }}
