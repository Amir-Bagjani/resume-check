name: build-standalone
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            exe: dist/ResumeCheck.exe
            artifact: resumecheck-Windows
            timeout: 20
            shell: pwsh
          - os: macos-15-intel
            exe: dist/ResumeCheck.app
            artifact: resumecheck-macOS-x64
            timeout: 45
            arch: x86_64
            shell: bash
          - os: macos-15
            exe: dist/ResumeCheck.app
            artifact: resumecheck-macOS-arm64
            timeout: 45
            arch: arm64
            shell: bash
          - os: ubuntu-latest
            exe: dist/ResumeCheck
            artifact: resumecheck-Linux
            timeout: 45
            shell: bash
    runs-on: ${{ matrix.os }}
    # A stalled step must fail loudly and upload its evidence instead of hanging.
    timeout-minutes: ${{ matrix.timeout }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      # Windows consoles default to a legacy code page; Persian log output crashes otherwise.
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify macOS build architecture
        if: runner.os == 'macOS'
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          python -c "import os, platform; actual = platform.machine(); print('Python architecture:', actual); assert actual == os.environ['EXPECTED_ARCH'], actual"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Folder upload UI tests
        run: node --test source/frontend/tests/setup.test.cjs source/frontend/tests/jobinja.test.cjs source/frontend/tests/zip.test.cjs
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r source/backend/requirements-dev.txt
      - name: Backend tests - extraction and API
        working-directory: source
        run: python ../packaging/run_tests.py 480 python -m pytest backend/tests/test_backend.py -ra --tb=short -o stallwatch_seconds=120
      - name: Backend tests - Jobinja HTTP and parsing
        working-directory: source
        run: python ../packaging/run_tests.py 480 python -m pytest backend/tests/test_jobinja.py -vv -ra --tb=short -o stallwatch_seconds=120 -k "not gone and not unclassified and not viewer and not persian"
      - name: Backend tests - Jobinja 403/404 reporting
        working-directory: source
        run: python ../packaging/run_tests.py 480 python -m pytest backend/tests/test_jobinja.py -vv -ra --tb=short -o stallwatch_seconds=120 -k "gone or unclassified"
      - name: Backend tests - Jobinja import pipeline
        working-directory: source
        run: python ../packaging/run_tests.py 480 python -m pytest backend/tests/test_jobinja.py -vv -ra --tb=short -o stallwatch_seconds=120 -k "viewer or persian"
      - name: Backend tests - ZIP export
        working-directory: source
        run: python ../packaging/run_tests.py 480 python -m pytest backend/tests/test_zip.py -ra --tb=short -o stallwatch_seconds=120
      - name: Backend tests - packaging and launcher
        working-directory: source
        run: python ../packaging/run_tests.py 480 python -m pytest backend/tests/test_packaging.py -ra --tb=short -o stallwatch_seconds=120
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: .\packaging\build_windows.ps1
      - name: Build (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r source/backend/requirements.txt "pyinstaller==6.22.3"
          python -c "import shutil; [shutil.rmtree(d, ignore_errors=True) for d in ('build', 'dist')]"
          python -m PyInstaller --noconfirm packaging/resumecheck.spec
      - name: Verify macOS binary architecture
        if: runner.os == 'macOS'
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          binary="${{ matrix.exe }}/Contents/MacOS/ResumeCheck"
          file "$binary"
          lipo -info "$binary"
          test "$(lipo -archs "$binary")" = "$EXPECTED_ARCH"
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: |
          .\.github\workflows\smoke_win.ps1 -Exe dist\ResumeCheck.exe
      - name: Smoke test (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          python packaging/smoke.py "${{ matrix.exe }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.exe }}
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-evidence
          path: |
            smoke-server.log
            .server.log
            **/pytest-*.log
